  if(HAND==="R")return byType("mlb-sl").sort((a,b)=>roleN(a)-roleN(b)).map(r=>({r,o:`<span class="ord">${r.role}</span>`,pos:r.position}));
  return lastL.dataPlayers.slice().sort((a,b)=>a.BO-b.BO).map(e=>({r:byAm[e.mlbamid]||{player:e.playerName,mlbamid:e.mlbamid},o:`<span class="ord">${e.BO}</span>`,pos:e.Position}));
}
function lineupCard(){
  const tools=`<div class="seg" id="hand"><button data-h="R" class="${HAND==="R"?"on":""}">vs RHP</button><button data-h="L" class="${HAND==="L"?"on":""}">vs LHP</button></div>`;
  const note=HAND==="R"?`RosterResource's go-to lineup vs right-handed starters${ROUNDN?` for the ${ROUNDN}`:""}.`:`RosterResource publishes only the vs RHP lineup during the postseason, so this is the lineup the Yankees last used against a left-hander (${lastL.gameList.label} ${lastL.gameList.label2}), from its last-6-lineups data.`;
  return card("lineup","Starting lineup",ROUNDN?ROUNDN+" roster":"",tools,`<div class="note">${note}</div>`+hitTable(lineupList(),"Ord"),SRC_H,{cls:"lineup"});
}
function render(){
  const bench=byType("mlb-bn").map(r=>({r,o:`<span class="pos">BN</span>`,pos:r.position}));
  const rot=byType("mlb-sp").sort((a,b)=>roleN(a)-roleN(b)).map(r=>({r,o:`<span class="pos cl">${r.role}</span>`}));
  const RO={CL:0,SU8:1,SU7:2,MID:3,LR:4};
  const pen=byType("mlb-bp").sort((a,b)=>(RO[a.role]??9)-(RO[b.role]??9)).map(r=>({r,o:`<span class="pos${r.role==="CL"?" cl":""}" data-tip="${({CL:"Closer",SU8:"Setup, 8th inning",SU7:"Setup, 7th inning",MID:"Middle relief",LR:"Long relief"})[r.role]||r.role}">${r.role}</span>`}));
  const inact=byType("mlb-in-pt").map(r=>({r,o:`<span class="pos">${r.position}</span>`}));
  const il=rows.filter(r=>r.type.startsWith("il-"));
  const ilBody=tbl(`<th>Status</th><th>Pos</th><th class="r jn">#</th><th>Player</th><th class="c">B/T</th><th class="r">Age</th><th>Injury</th><th class="r">Date</th><th class="r">Retro</th><th class="c pc">Headline · pct</th>${xh()}`,
    il.map(r=>tr(r,`<td><span class="pos il">${r.role}</span></td><td><span class="pos">${r.position}</span></td><td class="r jn">${r.jnum||DASH}</td><td>${nameCell(r,r.type==="il-pp"?hpill(r):ppill(r))}</td><td class="c">${r.bats}/${r.throws}</td><td class="r mu">${r.age}</td><td>${esc(r.injurynotes||DASH)}</td><td class="r mu">${r.injurydate||DASH}</td><td class="r mu">${r.retrodate||DASH}</td><td class="c pc">${r.type==="il-pp"?hpill(r):ppill(r)}</td>${xd(r)}`)).join(""));
  $("main").innerHTML=lineupCard()
   +card("bench","Bench",`${bench.length} players`,"",hitTable(bench,null),SRC_H)
   +card("rot","Starting rotation",ROUNDN?ROUNDN:"","",`${ROUNDN?`<div class="note">RosterResource lists ${rot.length} starters for the ${ROUNDN}.</div>`:""}`+pitTable(rot,"Role","sp"),SRC_P)
   +card("pen","Bullpen","roles","",pitTable(pen,"Role","bp"),SRC_P)
   +card("il","Injured list",`${il.length} players`,"",ilBody,`Injuries and IL status: RosterResource, updated ${D.asof.rr}. Headline stat as in the lineup and bullpen.`)
   +(inact.length?card("inact",`Inactive for the ${ROUNDN||"series"}`,"","",pitTable(inact,"Pos","bp"),SRC_P):"")
   +minorsCard();
  side();wire();
}
/* ===== minors depth ===== */
const LV=[["aaa","AAA"],["aa","AA"],["ha","High-A"],["la","Low-A"],["ss","Complex"]];
let LVL="aaa";
function minorsCard(){
  const tools=`<div class="seg" id="lvl">${LV.map(([k,l])=>`<button data-l="${k}" class="${k===LVL?"on":""}">${l}</button>`).join("")}</div>`;
  const list=rows.filter(r=>r.type.split("-")[0]===LVL);
  const grp=[["Position players",list.filter(r=>r.type.endsWith("-pp"))],["Starters",list.filter(r=>r.type.endsWith("-sp"))],["Relievers",list.filter(r=>r.type.endsWith("-rp"))],["Pitchers",list.filter(r=>r.type.endsWith("-pt"))]].filter(g=>g[1].length);
  const body=grp.map(([h,l])=>`<div class="note" style="margin:8px 2px 2px"><b style="color:var(--navy2)">${h}</b> · ${l.length}</div>`+tbl(`<th>Pos</th><th class="r jn">#</th><th>Player</th><th class="c">B/T</th><th class="r">Age</th><th>Prospect rank</th><th>ETA</th>${xh()}`,
    l.map((r,i)=>tr(r,`<td><span class="pos">${r.position||DASH}</span></td><td class="r jn">${r.jnum||DASH}</td><td>${nameCell(r)}</td><td class="c">${r.bats||DASH}/${r.throws||DASH}</td><td class="r mu">${r.age||DASH}</td><td>${prospect(r)}</td><td class="mu">${r.eta||DASH}</td>${xd(r)}`).replace('<tr class="pr"',i>=8?'<tr class="pr mr"':'<tr class="pr"')).join(""))+(l.length>8?`<div class="more8">+ ${l.length-8} more ${h.toLowerCase()} · All columns shows everyone</div>`:"")).join("");
  return card("minors","Minor-league depth","","",`<div class="mn">${tools}</div>`+body,`Depth by level: RosterResource, updated ${D.asof.rr}. "Complex" is RosterResource's lowest level group (mostly Dominican Summer League players).`,{cls:"minors"});
}
/* ===== side column ===== */
function side(){
  const me=D.standings.find(s=>s.TeamId===TEAM.fg);
  const stand=`<section class="card"><h3>${TEAM.lg} ${({E:"East",C:"Central",W:"West"})[TEAM.div]} standings <i>odds: RosterResource</i></h3>
    <div class="st h"><span></span><span>Team</span><span class="r">W</span><span class="r">L</span><span class="r">W%</span><span class="r">GB</span></div>
    ${D.standings.map(s=>{const t=TFG[s.TeamId];return `<div class="st${s.TeamId===TEAM.fg?" me":""}" data-tip="${esc(`${t.name}: win division ${Math.round(s.divTitle*100)}%, make playoffs ${Math.round(s.poff*100)}%`)}"><img src="${LOGO(t.mlb)}" alt=""><span><b>${s.ShortName}</b>${s.divTitle>=1?"<em>DIV</em>":s.poff>=1?"<em>PO</em>":""}</span><span class="r num">${s.W}</span><span class="r num">${s.L}</span><span class="r num">${f3(s.Wpct)}</span><span class="r num">${s.GB||DASH}</span></div>`}).join("")}
    <div class="src">RosterResource, updated ${D.asof.rr}. DIV clinched division, PO clinched a playoff spot.</div></section>`;
  const RK=D.rank, rg=(l,o,keys)=>`<div class="rk"><div class="l">${l}</div><div class="chips">${keys.map(([k,n])=>{const v=o[k];const pc=v==null?null:Math.round((30-v)/29*100);const q=qc(pc);
     return `<div class="chip ${q.c}" style="--i:${q.i.toFixed(2)}" data-tip="${esc(`${l}: ${n} ranks ${v==null?DASH:ord(v)} of 30 MLB teams`)}"><b>${v==null?DASH:v}<sup>${v==null?"":ord(v).slice(-2)}</sup></b><small>${n}</small></div>`}).join("")}</div></div>`;
  const ranks=`<section class="card"><h3>Team rankings <i>rank of 30, ${D.season}</i></h3>
    ${rg("Hitting",RK.bat[0],[["AVG","AVG"],["OBP","OBP"],["OPS","OPS"],["R","R"],["HR","HR"],["SB","SB"]])}
    ${rg("Starting pitching",RK.sp[0],[["ERA","ERA"],["WHIP","WHIP"],["BB/9","BB/9"],["K/9","K/9"],["H/9","H/9"],["HR/9","HR/9"]])}
    ${rg("Relief pitching",RK.rp[0],[["ERA","ERA"],["WHIP","WHIP"],["BB/9","BB/9"],["K/9","K/9"],["H/9","H/9"],["HR/9","HR/9"]])}
    ${rg("Fielding",RK.fld[0],[["Defense","Def"],["DRS","DRS"],["OAA","OAA"],["FRP","FRV"],["aFRP","Arm"],["CFraming","Frm"]])}
    <div class="src">RosterResource team rankings (FanGraphs), updated ${D.asof.rr}. 1st = best; green for the top third.</div></section>`;
  const AQ={HG:["Homegrown","#1d3a63"],T:["Trade","#3d6aa8"],FA:["Free agent","#7f9cc4"],W:["Waivers","#b3c3d9"],R5:["Rule 5","#d5dde9"]};
  const aq=D.breakdown.acquired, n40=rows.filter(r=>r.roster40==="Y").length, tot=aq.reduce((a,x)=>a+x.numPlayers,0);
  const bd=`<section class="card"><h3>Roster breakdown <i>40-man: ${n40} of 40</i></h3>
    <div class="bd">${aq.filter(x=>x.numPlayers).map(x=>{const [l,c]=AQ[x.acquiredcode]||[x.acquiredcode,"#999"];return `<span style="--c:${c};width:${x.numPlayers/tot*100}%" data-tip="${l}: ${x.numPlayers}">${x.numPlayers}</span>`}).join("")}</div>
    <div class="leg">${aq.map(x=>{const [l,c]=AQ[x.acquiredcode]||[x.acquiredcode,"#999"];return `<span><i style="--c:${c}"></i>${l} <b>${x.numPlayers}</b></span>`}).join("")}</div>
    <div class="leg" style="margin-top:5px">Born: ${D.breakdown.country.map(c=>`<span>${c.country} <b>${c.numPlayers}</b></span>`).join("")}</div>
    <div class="src">How the 40-man roster was acquired and where it was born: RosterResource, updated ${D.asof.rr}.</div></section>`;
  const mv=`<section class="card"><h3>Latest roster moves <i>${D.moves.length} most recent</i></h3>
    ${D.moves.map(m=>`<div class="mv"><span class="d">${md(m.transDate)}</span><span><span class="ps">${m.position}</span><b>${esc(m.playerName)}</b> <span class="mu">${esc(m.transDesc)}</span></span></div>`).join("")}
    <div class="src">RosterResource, loaded ${D.moves[0]?D.moves[0].loaddate.slice(0,10):DASH}.</div></section>`;
  const gl=D.probables.gameList.filter(g=>g.oppTeam);
  const sch=`<section class="card"><h3>Upcoming games <i>probable starters</i></h3>
    ${gl.map(g=>{const o=TM[g.oppTeam];return `<div class="gm"><span class="d">${g.label} ${g.label2}<small>${g.isHomeTeam==="1"?"home":"away"}</small></span><img src="${LOGO(o.mlb)}" alt=""><span class="p">${g.isHomeTeam==="1"?"vs":"@"} <b>${o.short}</b><br><b>${esc(g.playerName||"TBD")}</b> <span class="mu">vs ${esc(g.oppPlayerName||"TBD")}</span></span></div>`}).join("")||`<div class="mu">No games listed.</div>`}
    <div class="src">${ROUNDN?`${ROUNDN}. `:""}RosterResource lists ${gl.length} game${gl.length===1?"":"s"} with an opponent in the next ${D.probables.gameList.length} days; later games appear as the series is set. Updated ${D.asof.rr}.</div></section>`;
  const tr0=D.prospects.teamRank[0], pr=D.prospects.prospects;
  const pros=`<section class="card"><h3>Top prospects <i>farm system ${ord(tr0.rank)} of 30</i></h3>
    <div class="pp" style="cursor:default;padding-top:0"><span class="o">#</span><span class="o">Player</span><span class="o" style="text-align:center">FV</span><span class="o" style="text-align:right">Top 100</span></div>
    ${pr.map(p=>`<div class="pp" data-tip="${esc(`${p.playerName}: ${p.Position}, ${p.llevel}, age ${(+p.Age).toFixed(1)}, ETA ${p.ETA_Current||DASH}`)}"><span class="o">${p.Org_Rank}</span><span><b>${esc(p.playerName)}</b><small>${p.Position} · ${p.llevel||DASH} · age ${(+p.Age).toFixed(1)} · ETA ${p.ETA_Current||DASH}</small></span><span class="fv">${p.cFV}</span><span class="ovr">${p.Ovr_Rank?"#"+p.Ovr_Rank:DASH}</span></div>`).join("")}
    <div class="src">FanGraphs prospect list (FV = future value), ${D.prospects.season||D.season}; farm system value $${(tr0.valuationTeam/1e6).toFixed(1)}M. Via RosterResource, updated ${D.asof.rr}.</div></section>`;
  $("side").innerHTML=stand+ranks+sch+bd+mv+pros;
}
/* header */
(function(){const me=D.standings.find(s=>s.TeamId===TEAM.fg),pos=D.standings.indexOf(me)+1;
  $("tname").textContent=TEAM.name;
  $("tmeta").innerHTML=`<b class="num">${me.W}–${me.L}</b> · ${ord(pos)} in ${TEAM.lg} ${({E:"East",C:"Central",W:"West"})[TEAM.div]}${me.GB?` · ${me.GB} GB`:""} · ${D.season}${ROUNDN?` <span class="tag g">${ROUNDN}</span>`:""}`;
  $("asof").innerHTML=`Depth chart: <b>FanGraphs RosterResource</b>, updated ${D.asof.rr}<br>Stats: FanGraphs ${D.season} regular season, as of ${D.asof.bat}`;
  const tp=["AL","NL"].map(lg=>`<div><h5>${lg==="AL"?"American League":"National League"}</h5><div class="dv">${["E","C","W"].map(dv=>`<div><i>${({E:"East",C:"Central",W:"West"})[dv]}</i>${D.teams.filter(t=>t.lg===lg&&t.div===dv).map(t=>`<a class="tm${t.abb===D.team?" on":""}" href="#team=${t.abb}" title="${esc(t.name)}"><img src="${LOGO(t.mlb)}" alt="">${t.abb}</a>`).join("")}</div>`).join("")}</div></div>`).join("");
  $("tpop").innerHTML=tp;
})();
/* search (D23): narrows as you type; each match shows headshot, name, team, position and years */
const SX=[...rows.filter(r=>r.mlbamid&&r.player).map(r=>({n:r.player,id:r.mlbamid,t:D.team,pos:r.position,y:D.years[r.mlbamid]||(r.type.startsWith("mlb")||r.type.startsWith("il")?String(D.season):"no MLB time")})),...D.others.map(o=>({n:o.n,id:o.id,t:o.t,pos:o.pos,y:o.y}))]
  .filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
let SI=0;
function search(){const q=norm($("q").value.trim());const dd=$("dd");if(!q){dd.hidden=true;return}
  const hits=SX.filter(x=>norm(x.n).split(/[\s.]+/).some(w=>w.startsWith(q))||norm(x.n).includes(q)).sort((a,b)=>(norm(b.n).startsWith(q)-norm(a.n).startsWith(q))||(b.y.startsWith("20")-a.y.startsWith("20"))).slice(0,8);
  SI=Math.min(SI,Math.max(0,hits.length-1));
  const mk=n=>{const i=norm(n).indexOf(q);return i<0?esc(n):esc(n.slice(0,i))+"<mark>"+esc(n.slice(i,i+q.length))+"</mark>"+esc(n.slice(i+q.length))};
  dd.innerHTML=hits.length?hits.map((x,i)=>`<a href="#" class="${i===SI?"on":""}"><img src="${HS(x.id)}" alt=""><span><b>${mk(x.n)}</b><small>${esc(TM[x.t]?TM[x.t].name:x.t)} · ${x.pos||DASH}</small></span><span class="yrs">${x.y}</span></a>`).join(""):`<div class="none">No player matches "${esc($("q").value)}" in this draft's data.</div>`;dd.hidden=false}
$("q").addEventListener("input",()=>{SI=0;search()});
$("q").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){SI++;search();e.preventDefault()}if(e.key==="ArrowUp"){SI=Math.max(0,SI-1);search();e.preventDefault()}if(e.key==="Escape"){$("dd").hidden=true}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("dd").hidden=true;if(e.target.closest("#tbtn")){$("tpop").hidden=!$("tpop").hidden}else if(!e.target.closest("#tpop"))$("tpop").hidden=true});
/* interactions */
function wire(){
  document.querySelectorAll(".xp").forEach(b=>b.onclick=()=>{b.closest(".card").classList.toggle("open");b.textContent=b.closest(".card").classList.contains("open")?"Fewer columns ‹":"All columns ›";edges()});
  document.querySelectorAll("#hand button").forEach(b=>b.onclick=()=>{HAND=b.dataset.h;const open=$("lineup").classList.contains("open");$("lineup").outerHTML=lineupCard();if(open){$("lineup").classList.add("open");$("lineup").querySelector(".xp").textContent="Fewer columns ‹"}wire()});
  document.querySelectorAll("#lvl button").forEach(b=>b.onclick=()=>{LVL=b.dataset.l;const open=$("minors").classList.contains("open");$("minors").outerHTML=minorsCard();if(open)$("minors").classList.add("open");wire()});
  document.querySelectorAll(".tw").forEach(t=>t.onscroll=edges);edges();
}
function edges(){document.querySelectorAll(".tw").forEach(t=>t.parentNode.classList.toggle("more",t.scrollWidth-t.clientWidth-t.scrollLeft>2))}
addEventListener("resize",edges);
/* tooltips */
const tip=$("tip");
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(!el){tip.hidden=true;return}tip.innerHTML=el.dataset.tip;tip.hidden=false});
document.addEventListener("mousemove",e=>{if(tip.hidden)return;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+"px";tip.style.top=(e.clientY+16)+"px"});
render();
</script>
</body></html>
