:root{--navy:#0c2340;--navy2:#1d3a63;--ink:#0f1c2e;--mut:#5d6b7e;--faint:#95a1b1;--hair:rgba(12,35,64,.10);
  --good:#16a34a;--goodk:#0d7a37;--bad:#b0583f;--badk:#9c4631;
  --tc:#0c2340;--tc2:#c4ced3;
  --card:linear-gradient(180deg,#ffffff 0%,#f7f9fc 100%);
  --sh:0 1px 0 #fff inset,0 18px 40px -22px rgba(12,35,64,.35),0 3px 10px -4px rgba(12,35,64,.12);}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:#eef2f7;-webkit-font-smoothing:antialiased;font-size:13px}
.num,td{font-variant-numeric:tabular-nums}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 600px at 30% 0%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),radial-gradient(1200px 700px at 80% 10%,rgba(29,58,99,.10),transparent 70%),linear-gradient(180deg,#f7f9fc 0%,#e9eef5 100%)}
#bg .photo{position:absolute;inset:0 0 auto 0;height:420px;background:url("https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/A_Great_Night_at_Yankee_Stadium.jpg/1920px-A_Great_Night_at_Yankee_Stadium.jpg") center 55%/cover;
  opacity:.12;filter:grayscale(.6) blur(2px);mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 100%);mask-image:linear-gradient(180deg,#000 0%,transparent 100%)}
#bg .mark{position:absolute;right:6%;top:40px;width:340px;opacity:.04}
#app{position:relative;z-index:1;max-width:1560px;margin:0 auto;padding:12px 20px 26px}
/* top bar */
.bar{display:flex;align-items:center;gap:14px;position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:9px;font:700 21px Fraunces,serif;color:var(--navy);letter-spacing:-.01em;white-space:nowrap}
.brand .m{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#fff;font:800 15px Manrope;letter-spacing:-.04em;
  background:linear-gradient(180deg,#2a4a78,var(--navy));box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 8px 16px -8px rgba(12,35,64,.7)}
.search{position:relative;flex:0 1 460px;margin-left:10px}
.search input{width:100%;font:600 14px Manrope;color:var(--ink);border:0;border-radius:99px;padding:11px 16px 11px 40px;outline:none;
  background:linear-gradient(180deg,#fff,#f3f6fa);box-shadow:0 1px 0 #fff inset,0 0 0 1px var(--hair),0 8px 20px -12px rgba(12,35,64,.35)}
.search input:focus{box-shadow:0 0 0 2px var(--navy2),0 8px 20px -12px rgba(12,35,64,.35)}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--faint)}
.dd{position:absolute;left:0;right:0;top:calc(100% + 6px);border-radius:18px;padding:6px;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);
  box-shadow:0 0 0 1px var(--hair),0 24px 50px -20px rgba(12,35,64,.45);max-height:430px;overflow:auto}
.dd[hidden]{display:none}
.dd a{display:grid;grid-template-columns:36px 1fr auto;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.dd a:hover,.dd a.on{background:#eef2f7}
.dd img{width:36px;height:36px;border-radius:50%;object-fit:cover;background:#e3e9f1}
.dd b{font-weight:800;color:var(--navy)}
.dd b mark{background:rgba(22,163,74,.16);color:inherit;border-radius:3px}
.dd small{display:block;color:var(--mut);font-size:11.5px}
.dd .yrs{font-size:11px;font-weight:700;color:var(--faint)}
.dd .none{padding:12px;color:var(--mut)}
.teams{margin-left:auto;position:relative}
.tbtn{display:flex;align-items:center;gap:8px;font:800 12.5px Manrope;color:var(--navy);border:0;border-radius:99px;padding:6px 14px 6px 7px;cursor:pointer;
  background:linear-gradient(180deg,#fff,#eef2f7);box-shadow:0 1px 0 #fff inset,0 0 0 1px var(--hair),0 6px 14px -8px rgba(12,35,64,.35)}
.tbtn img{width:26px;height:26px}
.tpop{position:absolute;right:0;top:calc(100% + 8px);width:min(640px,94vw);border-radius:22px;padding:14px 16px;background:rgba(255,255,255,.98);backdrop-filter:blur(10px);
  box-shadow:0 0 0 1px var(--hair),0 30px 60px -24px rgba(12,35,64,.5);display:grid;grid-template-columns:1fr 1fr;gap:16px}
.tpop[hidden]{display:none}
.tpop h5{margin:0 0 6px;font:800 10.5px Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--navy2)}
.tpop .dv{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tpop .dv i{font:800 9.5px Manrope;font-style:normal;letter-spacing:.12em;color:var(--faint);text-transform:uppercase;padding-left:4px}
.tpop .dv div{display:flex;flex-direction:column;gap:3px}
.tm{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:10px;font:800 12px Manrope;color:var(--ink)}
.tm img{width:22px;height:22px}
.tm:hover{background:#eef2f7}
.tm.on{background:linear-gradient(180deg,#2a4a78,var(--navy));color:#fff}
/* team ceremony */
.hero{display:flex;align-items:center;gap:18px;margin:16px 0 14px}
.hero .lg{width:76px;height:76px;border-radius:22px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center}
.hero .lg img{width:54px}
.hero h1{margin:0;font:700 36px Fraunces,serif;color:var(--navy);letter-spacing:-.01em;line-height:1}
.hero .meta{margin-top:6px;color:var(--mut);font-size:13px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.hero .meta b{color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font:800 10.5px Manrope;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:4px 9px;color:#fff;
  background:linear-gradient(180deg,#2a4a78,var(--navy));box-shadow:0 1px 0 rgba(255,255,255,.25) inset}
.tag.g{background:linear-gradient(180deg,#22b35a,#128a41)}
.hero .asof{margin-left:auto;text-align:right;font-size:11.5px;color:var(--mut);max-width:420px}
/* grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:16px;align-items:start}
.main,.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{position:relative;border-radius:24px;padding:14px 16px 12px;background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(247,249,252,.95));
  border:1px solid rgba(255,255,255,.95);outline:1px solid var(--hair);outline-offset:-1px;min-width:0;
  box-shadow:0 1px 0 #fff inset,0 1px 2px rgba(12,35,64,.06),0 10px 30px -12px rgba(12,35,64,.28),0 30px 60px -40px rgba(12,35,64,.25)}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:60px;border-radius:24px 24px 0 0;background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,0));pointer-events:none}
.ch{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 2px 10px}
.ch h2{margin:0;font:700 19px Fraunces,serif;color:var(--navy)}
.ch h2 small{font:800 10px Manrope;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);margin-left:8px}
.ch .sp{flex:1}
.xp{font:800 11.5px Manrope;color:var(--navy2);border:0;border-radius:99px;padding:7px 13px;cursor:pointer;background:linear-gradient(180deg,#fff,#eef2f7);
  box-shadow:0 1px 0 #fff inset,0 0 0 1px var(--hair),0 3px 8px -4px rgba(12,35,64,.3)}
.xp:hover{transform:translateY(-1px)}
.card.open .xp{color:#fff;background:linear-gradient(180deg,#2a4a78,var(--navy))}
.seg{display:inline-flex;padding:3px;border-radius:99px;background:linear-gradient(180deg,#e9eef5,#f5f7fa);box-shadow:inset 0 1px 3px rgba(12,35,64,.14)}
.seg button{font:800 12px Manrope;color:var(--mut);border:0;background:none;border-radius:99px;padding:7px 14px;cursor:pointer}
.seg button.on{color:#fff;background:linear-gradient(180deg,#2a4a78,var(--navy));box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 4px 10px -4px rgba(12,35,64,.6)}
.note{position:relative;font-size:11.5px;color:var(--mut);margin:-4px 2px 8px}
.src{position:relative;font-size:10.5px;color:var(--faint);margin:8px 2px 0;line-height:1.45}
/* roster tables: rounded glossy rows */
.twrap{position:relative}
.tw{overflow-x:auto;scrollbar-width:thin;border-radius:14px}
.twrap::after{content:"";position:absolute;top:0;right:0;bottom:0;width:30px;border-radius:0 14px 14px 0;pointer-events:none;opacity:0;transition:opacity .2s;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(12,35,64,.16))}
.twrap.more::after{opacity:1}
table{border-collapse:separate;border-spacing:0 4px;width:100%;font-size:12.5px;white-space:nowrap}
th{font:800 9.5px Manrope;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);text-align:left;padding:0 7px 1px;vertical-align:bottom}
th.r,td.r{text-align:right}
th.c,td.c{text-align:center}
td{padding:3px 7px;background:linear-gradient(180deg,#fff,#f5f7fb);border-top:1px solid rgba(12,35,64,.06);border-bottom:1px solid rgba(12,35,64,.09)}
td:first-child{border-radius:14px 0 0 14px;border-left:1px solid rgba(12,35,64,.07)}
td:last-child{border-radius:0 14px 14px 0;border-right:1px solid rgba(12,35,64,.07)}
tr.pr{cursor:pointer}
tr.pr td{transition:background .12s,box-shadow .12s}
tr.pr:hover td{background:linear-gradient(180deg,#fff,#eaf0f8);border-color:rgba(29,58,99,.22)}
tr.pr:hover .nm b{color:var(--navy2);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
tr.hl td{background:linear-gradient(180deg,#f3fbf6,#e7f5ec)}
.x{display:none}
.card.open .x{display:table-cell}
tr.mr{display:none}.card.open tr.mr{display:table-row}.card.open .more8{display:none}
.more8{font:700 11.5px Manrope;color:var(--navy2);margin:2px 4px 4px}
.ord{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font:800 12px Manrope;color:#fff;background:radial-gradient(circle at 35% 25%,#46679a,var(--navy));box-shadow:0 2px 5px -2px rgba(12,35,64,.6)}
.pos{display:inline-block;min-width:30px;text-align:center;font:800 11px Manrope;color:var(--navy2);border-radius:8px;padding:3px 6px;background:linear-gradient(180deg,#f3f6fa,#e4eaf2);box-shadow:0 1px 0 #fff inset,0 0 0 1px rgba(12,35,64,.07)}
.pos.cl{color:#fff;background:linear-gradient(180deg,#2a4a78,var(--navy))}
.pos.il{color:#8a3b2e;background:linear-gradient(180deg,#fbf1ee,#f2e0db)}
.jn{color:var(--faint);font-weight:700}
.nm{display:flex;align-items:center;gap:9px}
.nm img{width:28px;height:28px;border-radius:50%;object-fit:cover;object-position:50% 12%;background:#e3e9f1;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(12,35,64,.08)}
.nm b{font-weight:800;color:var(--navy);font-size:13px}
.nm i{font-style:normal;font:800 9px Manrope;letter-spacing:.06em;color:var(--mut);background:#eef2f7;border-radius:99px;padding:2px 6px}
.mu{color:var(--mut)}
.nm .mob{display:none;margin-left:auto;padding-left:8px}
.fa{color:var(--faint)}
/* the headline stat: a small glossy pill, green by percentile (D12) */
.pill{display:inline-flex;align-items:baseline;gap:5px;min-width:78px;justify-content:space-between;border-radius:99px;padding:4px 10px 4px 11px;
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0) 60%),linear-gradient(180deg,#fff,#eef1f6);border:1px solid rgba(12,35,64,.09);
  box-shadow:0 1px 0 #fff inset,0 3px 8px -5px rgba(12,35,64,.35)}
.pill b{font:700 15px Fraunces,serif;color:var(--navy);letter-spacing:-.01em}
.pill small{font:800 10px Manrope;color:var(--faint)}
.pill.g{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),linear-gradient(180deg,color-mix(in oklab,var(--good) calc(var(--i)*16% + 5%),#fff),color-mix(in oklab,var(--good) calc(var(--i)*30% + 12%),#f4f8f6));
  border-color:rgba(34,197,94,calc(.25 + var(--i)*.4));box-shadow:0 1px 0 #fff inset,0 0 calc(4px + var(--i)*12px) rgba(34,197,94,calc(.1 + var(--i)*.3))}
.pill.g b{color:var(--goodk)}.pill.g small{color:color-mix(in oklab,var(--goodk) 70%,#fff)}
.pill.b{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),linear-gradient(180deg,#fcf6f3,#f2e3dd);border-color:rgba(176,88,63,.35)}.pill.b b{color:var(--badk)}.pill.b small{color:color-mix(in oklab,var(--badk) 60%,#fff)}
/* last six games chips */
.l6{display:flex;gap:3px}
.l6 span{display:inline-grid;place-items:center;width:40px;height:22px;border-radius:7px;font:800 10px Manrope;color:var(--navy2);background:linear-gradient(180deg,#f5f7fb,#e8edf4);box-shadow:0 1px 0 #fff inset,0 0 0 1px rgba(12,35,64,.06)}
.l6 span sup{font-size:8.5px;color:var(--mut);margin-left:1px;top:-.3em}
.l6 span.e{background:none;box-shadow:inset 0 0 0 1px rgba(12,35,64,.06);color:var(--faint)}
.l6 span.hv{color:#fff;background:linear-gradient(180deg,#46679a,var(--navy))}
.l6 span.hv sup{color:#dbe4f0}
.l6 span.md{color:var(--navy2);background:linear-gradient(180deg,#e7edf6,#cfdaea)}
.l6h{display:flex;gap:3px}
.l6h span{width:40px;text-align:center;font:800 8.5px Manrope;letter-spacing:.02em;color:var(--faint);line-height:1.25;text-transform:none}
.l6h span em{font-style:normal;display:block;color:var(--mut)}
.l6h span em.L{color:#8b5a00}
.split2{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
/* side */
.side .card{padding:13px 14px 11px}
.side h3{position:relative;margin:0 0 9px;font:800 10.5px Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--navy2);display:flex;justify-content:space-between;align-items:baseline}
.side h3 i{font-style:normal;letter-spacing:0;text-transform:none;font-weight:700;color:var(--faint);font-size:10.5px}
.st{display:grid;grid-template-columns:24px 1fr 34px 34px 44px 38px;align-items:center;gap:4px;padding:6px 8px;border-radius:12px;font-size:12.5px}
.st.h{font:800 9.5px Manrope;letter-spacing:.08em;color:var(--faint);padding-top:0;padding-bottom:2px}
.st img{width:22px;height:22px}
.st.me{background:linear-gradient(180deg,#eef3fa,#e2eaf5);box-shadow:inset 0 0 0 1px rgba(29,58,99,.14)}
.st b{font-weight:800;color:var(--navy)}
.st .r{text-align:right}
.st em{font-style:normal;font:800 8.5px Manrope;color:#fff;background:#128a41;border-radius:99px;padding:1px 5px;margin-left:5px}
.rk{position:relative;margin-bottom:8px}
.rk .l{font:800 10px Manrope;color:var(--mut);margin:0 0 4px 2px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.chip{position:relative;border-radius:12px;padding:4px 2px 3px;text-align:center;border:1px solid rgba(12,35,64,.08);
  background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,0) 60%),linear-gradient(180deg,#fff,#eef1f6);box-shadow:0 1px 0 #fff inset,0 4px 10px -7px rgba(12,35,64,.4)}
.chip b{display:block;font:700 15px Fraunces,serif;color:var(--navy);line-height:1.1}
.chip b sup{font:800 8px Manrope;margin-left:1px}
.chip small{font:800 9px Manrope;color:var(--mut);letter-spacing:.02em}
.chip.g{background:linear-gradient(180deg,rgba(255,255,255,.75),rgba(255,255,255,0) 60%),linear-gradient(180deg,color-mix(in oklab,var(--good) calc(var(--i)*16% + 5%),#fff),color-mix(in oklab,var(--good) calc(var(--i)*30% + 12%),#f4f8f6));border-color:rgba(34,197,94,calc(.2 + var(--i)*.4))}
.chip.g b{color:var(--goodk)}
.chip.b{background:linear-gradient(180deg,rgba(255,255,255,.7),rgba(255,255,255,0) 60%),linear-gradient(180deg,#fcf6f3,#f2e3dd);border-color:rgba(176,88,63,.35)}
.chip.b b{color:var(--badk)}
.bd{position:relative;display:flex;height:26px;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--hair),0 4px 10px -6px rgba(12,35,64,.35)}
.bd span{display:grid;place-items:center;font:800 10.5px Manrope;color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%),var(--c)}
.leg{position:relative;display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:7px;font-size:11.5px;color:var(--mut)}
.leg b{color:var(--ink)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:3px;background:var(--c);margin-right:4px}
.mv{position:relative;display:grid;grid-template-columns:38px 1fr;gap:8px;padding:6px 4px;border-top:1px solid rgba(12,35,64,.06);font-size:12px}
.mv:first-of-type{border-top:0}
.mv .d{font:800 11px Manrope;color:var(--faint)}
.mv b{color:var(--navy);font-weight:800}
.mv .ps{font:800 9.5px Manrope;color:var(--mut);margin-right:3px}
.gm{position:relative;display:grid;grid-template-columns:48px 28px 1fr;align-items:center;gap:8px;padding:8px;border-radius:14px;background:linear-gradient(180deg,#fff,#f3f6fa);box-shadow:inset 0 0 0 1px rgba(12,35,64,.07)}
.gm img{width:28px;height:28px}
.gm .d{font:800 11px Manrope;color:var(--navy2);line-height:1.2}
.gm .d small{display:block;color:var(--faint)}
.gm .p{font-size:12px}.gm .p b{color:var(--navy)}
.pp{position:relative;display:grid;grid-template-columns:20px 1fr 36px 38px;gap:6px;align-items:center;padding:5px 6px;border-radius:12px;cursor:pointer;font-size:12px}
.pp:hover{background:#eef2f7}
.pp .o{font:800 11px Manrope;color:var(--faint)}
.pp b{color:var(--navy);font-weight:800}
.pp small{display:block;color:var(--mut);font-size:10.5px}
.fv{text-align:center;font:700 14px Fraunces,serif;color:var(--navy);border-radius:10px;padding:2px 0;background:linear-gradient(180deg,#fff,#eaf0f7);box-shadow:inset 0 0 0 1px rgba(12,35,64,.08)}
.ovr{text-align:right;font:800 10.5px Manrope;color:var(--mut)}
.bpu{display:flex;gap:3px}
.bpu span{display:inline-grid;place-items:center;width:34px;height:22px;border-radius:7px;font:800 10.5px Manrope;color:var(--faint);box-shadow:inset 0 0 0 1px rgba(12,35,64,.06)}
.bpu span.p{color:var(--navy);background:rgba(29,58,99,calc(.06 + var(--u)*.34));box-shadow:0 1px 0 #fff inset}
.bpu span.p.hi{color:#fff}
.bpu span sup{font-size:7.5px;margin-left:1px}
.mn .seg{margin-bottom:8px}
.foot{position:relative;display:flex;align-items:center;gap:16px;font-size:10.5px;line-height:1.5;color:var(--faint);margin-top:18px;padding-top:14px;background:var(--stitch) 0 0/11px 8px repeat-x}
.foot .fl{height:80px;width:auto;flex:none;display:block;filter:drop-shadow(0 3px 5px rgba(12,35,64,.18))}.foot b{color:var(--ink)}.foot .fa2{display:block;color:var(--mut);font-size:11px}
#tip{position:fixed;z-index:60;pointer-events:none;max-width:280px;font-size:12px;line-height:1.4;color:#fff;background:rgba(12,35,64,.95);border-radius:10px;padding:7px 10px;box-shadow:0 10px 24px -10px rgba(0,0,0,.5)}
#tip[hidden]{display:none}
/* laptop narrower */
@media (max-width:1180px){.split2{grid-template-columns:1fr}.grid{grid-template-columns:minmax(0,1fr) 330px}}
/* phone: stack, tables scroll inside their cards with a visible edge */
@media (max-width:820px){
  #app{padding:10px 10px 20px}
  .bar{flex-wrap:wrap;gap:8px}
  .brand{font-size:18px}.brand .m{width:32px;height:32px;font-size:13px}
  .search{order:3;flex:1 1 100%;margin:0}
  .tbtn span{display:none}.tbtn{padding:6px 10px 6px 7px}
  .tpop{grid-template-columns:1fr;right:-4px;max-height:70vh;overflow:auto}
  .hero{gap:12px;flex-wrap:wrap;margin:12px 0 10px}
  .hero .lg{width:58px;height:58px;border-radius:18px}.hero .lg img{width:40px}
  .hero h1{font-size:26px}
  .hero .asof{margin:0;text-align:left;flex-basis:100%}
  .grid{grid-template-columns:1fr}
  .card{border-radius:20px;padding:12px 10px 10px}
  .ch h2{font-size:17px}
  .chips{grid-template-columns:repeat(3,1fr)}
  .nm .mob{display:inline-flex}.nm .mob .pill{min-width:0;gap:4px;padding:3px 8px}
  td.jn,th.jn{display:none}.nm{gap:7px}.nm img{width:24px;height:24px}
  td.pc,th.pc{display:none}

  const il=rows.filter(r=>r.type.startsWith("il-"));
  const ilBody=tbl(`<th>Status</th><th>Pos</th><th class="r jn">#</th><th>Player</th><th class="c">B/T</th><th class="r">Age</th><th>Injury</th><th class="r">Date</th><th class="r">Retro</th><th class="c pc">Headline · pct</th>${xh()}`,
    il.map(r=>tr(r,`<td><span class="pos il">${r.role}</span></td><td><span class="pos">${r.position}</span></td><td class="r jn">${r.jnum||DASH}</td><td>${nameCell(r,r.type==="il-pp"?hpill(r):ppill(r))}</td><td class="c">${r.bats}/${r.throws}</td><td class="r mu">${r.age}</td><td>${esc(r.injurynotes||DASH)}</td><td class="r mu">${r.injurydate||DASH}</td><td class="r mu">${r.retrodate||DASH}</td><td class="c pc">${r.type==="il-pp"?hpill(r):ppill(r)}</td>${xd(r)}`)).join(""));
  $("main").innerHTML=lineupCard()
   +card("bench","Bench",`${bench.length} players`,"",hitTable(bench,null),SRC_H)
   +card("rot","Starting rotation",ROUNDN?ROUNDN:"","",`${ROUNDN?`<div class="note">RosterResource lists ${rot.length} starters for the ${ROUNDN}.</div>`:""}`+pitTable(rot,"Role","sp"),SRC_P)
   +card("pen","Bullpen","roles","",pitTable(pen,"Role","bp"),SRC_P)
   +card("il","Injured list",`${il.length} players`,"",ilBody,`Injuries and IL status: RosterResource, updated ${D.asof.rr}. Headline stat as in the lineup and bullpen.`)
   +(inact.length?card("inact",`Inactive for the ${ROUNDN||"series"}`,"","",pitTable(inact,"Pos","bp"),SRC_P):"")
   +minorsCard();
  side();wire();
}
/* ===== minors depth ===== */
const LV=[["aaa","AAA"],["aa","AA"],["ha","High-A"],["la","Low-A"],["ss","Complex"]];
let LVL="aaa";
function minorsCard(){
  const tools=`<div class="seg" id="lvl">${LV.map(([k,l])=>`<button data-l="${k}" class="${k===LVL?"on":""}">${l}</button>`).join("")}</div>`;
  const list=rows.filter(r=>r.type.split("-")[0]===LVL);
  const grp=[["Position players",list.filter(r=>r.type.endsWith("-pp"))],["Starters",list.filter(r=>r.type.endsWith("-sp"))],["Relievers",list.filter(r=>r.type.endsWith("-rp"))],["Pitchers",list.filter(r=>r.type.endsWith("-pt"))]].filter(g=>g[1].length);
  const body=grp.map(([h,l])=>`<div class="note" style="margin:8px 2px 2px"><b style="color:var(--navy2)">${h}</b> · ${l.length}</div>`+tbl(`<th>Pos</th><th class="r jn">#</th><th>Player</th><th class="c">B/T</th><th class="r">Age</th><th>Prospect rank</th><th>ETA</th>${xh()}`,
    l.map((r,i)=>tr(r,`<td><span class="pos">${r.position||DASH}</span></td><td class="r jn">${r.jnum||DASH}</td><td>${nameCell(r)}</td><td class="c">${r.bats||DASH}/${r.throws||DASH}</td><td class="r mu">${r.age||DASH}</td><td>${prospect(r)}</td><td class="mu">${r.eta||DASH}</td>${xd(r)}`).replace('<tr class="pr"',i>=8?'<tr class="pr mr"':'<tr class="pr"')).join(""))+(l.length>8?`<div class="more8">+ ${l.length-8} more ${h.toLowerCase()} · All columns shows everyone</div>`:"")).join("");
  return card("minors","Minor-league depth","","",`<div class="mn">${tools}</div>`+body,`Depth by level: RosterResource, updated ${D.asof.rr}. "Complex" is RosterResource's lowest level group (mostly Dominican Summer League players).`,{cls:"minors"});
}
/* ===== side column ===== */
function side(){
  const me=D.standings.find(s=>s.TeamId===TEAM.fg);
  const stand=`<section class="card"><h3>${TEAM.lg} ${({E:"East",C:"Central",W:"West"})[TEAM.div]} standings <i>odds: RosterResource</i></h3>
    <div class="st h"><span></span><span>Team</span><span class="r">W</span><span class="r">L</span><span class="r">W%</span><span class="r">GB</span></div>
    ${D.standings.map(s=>{const t=TFG[s.TeamId];return `<div class="st${s.TeamId===TEAM.fg?" me":""}" data-tip="${esc(`${t.name}: win division ${Math.round(s.divTitle*100)}%, make playoffs ${Math.round(s.poff*100)}%`)}"><img src="${LOGO(t.mlb)}" alt=""><span><b>${s.ShortName}</b>${s.divTitle>=1?"<em>DIV</em>":s.poff>=1?"<em>PO</em>":""}</span><span class="r num">${s.W}</span><span class="r num">${s.L}</span><span class="r num">${f3(s.Wpct)}</span><span class="r num">${s.GB||DASH}</span></div>`}).join("")}
    <div class="src">RosterResource, updated ${D.asof.rr}. DIV clinched division, PO clinched a playoff spot.</div></section>`;
  const RK=D.rank, rg=(l,o,keys)=>`<div class="rk"><div class="l">${l}</div><div class="chips">${keys.map(([k,n])=>{const v=o[k];const pc=v==null?null:Math.round((30-v)/29*100);const q=qc(pc);
     return `<div class="chip ${q.c}" style="--i:${q.i.toFixed(2)}" data-tip="${esc(`${l}: ${n} ranks ${v==null?DASH:ord(v)} of 30 MLB teams`)}"><b>${v==null?DASH:v}<sup>${v==null?"":ord(v).slice(-2)}</sup></b><small>${n}</small></div>`}).join("")}</div></div>`;
  const ranks=`<section class="card"><h3>Team rankings <i>rank of 30, ${D.season}</i></h3>
    ${rg("Hitting",RK.bat[0],[["R","R"],["HR","HR"],["SB","SB"]])}
    ${rg("Starting pitching",RK.sp[0],[["ERA","ERA"],["WHIP","WHIP"],["BB/9","BB/9"],["K/9","K/9"],["H/9","H/9"],["HR/9","HR/9"]])}
    ${rg("Relief pitching",RK.rp[0],[["ERA","ERA"],["WHIP","WHIP"],["BB/9","BB/9"],["K/9","K/9"],["H/9","H/9"],["HR/9","HR/9"]])}
    ${rg("Fielding",RK.fld[0],[["Defense","Def"],["DRS","DRS"],["OAA","OAA"],["FRP","FRV"],["aFRP","Arm"],["CFraming","Frm"]])}
    <div class="src">RosterResource team rankings (FanGraphs), updated ${D.asof.rr}. 1st = best; green for the top third.</div></section>`;
  const AQ={HG:["Homegrown","#1d3a63"],T:["Trade","#3d6aa8"],FA:["Free agent","#7f9cc4"],W:["Waivers","#b3c3d9"],R5:["Rule 5","#d5dde9"]};
  const aq=D.breakdown.acquired, n40=rows.filter(r=>r.roster40==="Y").length, tot=aq.reduce((a,x)=>a+x.numPlayers,0);
  const bd=`<section class="card"><h3>Roster breakdown <i>40-man: ${n40} of 40</i></h3>
    <div class="bd">${aq.filter(x=>x.numPlayers).map(x=>{const [l,c]=AQ[x.acquiredcode]||[x.acquiredcode,"#999"];return `<span style="--c:${c};width:${x.numPlayers/tot*100}%" data-tip="${l}: ${x.numPlayers}">${x.numPlayers}</span>`}).join("")}</div>
    <div class="leg">${aq.map(x=>{const [l,c]=AQ[x.acquiredcode]||[x.acquiredcode,"#999"];return `<span><i style="--c:${c}"></i>${l} <b>${x.numPlayers}</b></span>`}).join("")}</div>
    <div class="leg" style="margin-top:5px">Born: ${D.breakdown.country.map(c=>`<span>${c.country} <b>${c.numPlayers}</b></span>`).join("")}</div>
    <div class="src">How the 40-man roster was acquired and where it was born: RosterResource, updated ${D.asof.rr}.</div></section>`;
  const mv=`<section class="card"><h3>Latest roster moves <i>${D.moves.length} most recent</i></h3>
    ${D.moves.map(m=>`<div class="mv"><span class="d">${md(m.transDate)}</span><span><span class="ps">${m.position}</span><b>${esc(m.playerName)}</b> <span class="mu">${esc(m.transDesc)}</span></span></div>`).join("")}
    <div class="src">RosterResource, loaded ${D.moves[0]?D.moves[0].loaddate.slice(0,10):DASH}.</div></section>`;
  const gl=D.probables.gameList.filter(g=>g.oppTeam);
  const sch=`<section class="card"><h3>Upcoming games <i>probable starters</i></h3>
    ${gl.map(g=>{const o=TM[g.oppTeam];return `<div class="gm"><span class="d">${g.label} ${g.label2}<small>${g.isHomeTeam==="1"?"home":"away"}</small></span><img src="${LOGO(o.mlb)}" alt=""><span class="p">${g.isHomeTeam==="1"?"vs":"@"} <b>${o.short}</b><br><b>${esc(g.playerName||"TBD")}</b> <span class="mu">vs ${esc(g.oppPlayerName||"TBD")}</span></span></div>`}).join("")||`<div class="mu">No games listed.</div>`}
    <div class="src">${ROUNDN?`${ROUNDN}. `:""}RosterResource lists ${gl.length} game${gl.length===1?"":"s"} with an opponent in the next ${D.probables.gameList.length} days; later games appear as the series is set. Updated ${D.asof.rr}.</div></section>`;
  const tr0=D.prospects.teamRank[0], pr=D.prospects.prospects;
  const pros=`<section class="card"><h3>Top prospects <i>farm system ${ord(tr0.rank)} of 30</i></h3>
    <div class="pp" style="cursor:default;padding-top:0"><span class="o">#</span><span class="o">Player</span><span class="o" style="text-align:center">FV</span><span class="o" style="text-align:right">Top 100</span></div>
    ${pr.map(p=>`<div class="pp" data-tip="${esc(`${p.playerName}: ${p.Position}, ${p.llevel}, age ${(+p.Age).toFixed(1)}, ETA ${p.ETA_Current||DASH}`)}"><span class="o">${p.Org_Rank}</span><span><b>${esc(p.playerName)}</b><small>${p.Position} · ${p.llevel||DASH} · age ${(+p.Age).toFixed(1)} · ETA ${p.ETA_Current||DASH}</small></span><span class="fv">${p.cFV}</span><span class="ovr">${p.Ovr_Rank?"#"+p.Ovr_Rank:DASH}</span></div>`).join("")}
    <div class="src">FanGraphs prospect list (FV = future value), ${D.prospects.season||D.season}; farm system value $${(tr0.valuationTeam/1e6).toFixed(1)}M. Via RosterResource, updated ${D.asof.rr}.</div></section>`;
  $("side").innerHTML=stand+ranks+sch+bd+mv+pros;
}
/* header */
(function(){const me=D.standings.find(s=>s.TeamId===TEAM.fg),pos=D.standings.indexOf(me)+1;
  $("tname").textContent=TEAM.name;
  $("tmeta").innerHTML=`<b class="num">${me.W}–${me.L}</b> · ${ord(pos)} in ${TEAM.lg} ${({E:"East",C:"Central",W:"West"})[TEAM.div]}${me.GB?` · ${me.GB} GB`:""} · ${D.season}${ROUNDN?` <span class="tag g">${ROUNDN}</span>`:""}`;
  $("asof").innerHTML=`Depth chart: <b>FanGraphs RosterResource</b>, updated ${D.asof.rr}<br>Stats: FanGraphs ${D.season} regular season, as of ${D.asof.bat}`;
  const tp=["AL","NL"].map(lg=>`<div><h5>${lg==="AL"?"American League":"National League"}</h5><div class="dv">${["E","C","W"].map(dv=>`<div><i>${({E:"East",C:"Central",W:"West"})[dv]}</i>${D.teams.filter(t=>t.lg===lg&&t.div===dv).map(t=>`<a class="tm${t.abb===D.team?" on":""}" href="#team=${t.abb}" title="${esc(t.name)}"><img src="${LOGO(t.mlb)}" alt="">${t.abb}</a>`).join("")}</div>`).join("")}</div></div>`).join("");
  $("tpop").innerHTML=tp;
})();
/* search (D23): narrows as you type; each match shows headshot, name, team, position and years */
const SX=[...rows.filter(r=>r.mlbamid&&r.player).map(r=>({n:r.player,id:r.mlbamid,t:D.team,pos:r.position,y:D.years[r.mlbamid]||(r.type.startsWith("mlb")||r.type.startsWith("il")?String(D.season):"no MLB time")})),...D.others.map(o=>({n:o.n,id:o.id,t:o.t,pos:o.pos,y:o.y}))]
  .filter((x,i,a)=>a.findIndex(y=>y.id===x.id)===i);
const norm=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
let SI=0;
function search(){const q=norm($("q").value.trim());const dd=$("dd");if(!q){dd.hidden=true;return}
  const hits=SX.filter(x=>norm(x.n).split(/[\s.]+/).some(w=>w.startsWith(q))||norm(x.n).includes(q)).sort((a,b)=>(norm(b.n).startsWith(q)-norm(a.n).startsWith(q))||(b.y.startsWith("20")-a.y.startsWith("20"))).slice(0,8);
  SI=Math.min(SI,Math.max(0,hits.length-1));
  const mk=n=>{const i=norm(n).indexOf(q);return i<0?esc(n):esc(n.slice(0,i))+"<mark>"+esc(n.slice(i,i+q.length))+"</mark>"+esc(n.slice(i+q.length))};
  dd.innerHTML=hits.length?hits.map((x,i)=>`<a href="#" class="${i===SI?"on":""}"><img src="${HS(x.id)}" alt=""><span><b>${mk(x.n)}</b><small>${esc(TM[x.t]?TM[x.t].name:x.t)} · ${x.pos||DASH}</small></span><span class="yrs">${x.y}</span></a>`).join(""):`<div class="none">No player matches "${esc($("q").value)}" in this draft's data.</div>`;dd.hidden=false}
$("q").addEventListener("input",()=>{SI=0;search()});
$("q").addEventListener("keydown",e=>{if(e.key==="ArrowDown"){SI++;search();e.preventDefault()}if(e.key==="ArrowUp"){SI=Math.max(0,SI-1);search();e.preventDefault()}if(e.key==="Escape"){$("dd").hidden=true}});
document.addEventListener("click",e=>{if(!e.target.closest(".search"))$("dd").hidden=true;if(e.target.closest("#tbtn")){$("tpop").hidden=!$("tpop").hidden}else if(!e.target.closest("#tpop"))$("tpop").hidden=true});
/* interactions */
function wire(){
  document.querySelectorAll(".xp").forEach(b=>b.onclick=()=>{b.closest(".card").classList.toggle("open");b.textContent=b.closest(".card").classList.contains("open")?"Fewer columns ‹":"All columns ›";edges()});
  document.querySelectorAll("#hand button").forEach(b=>b.onclick=()=>{HAND=b.dataset.h;const open=$("lineup").classList.contains("open");$("lineup").outerHTML=lineupCard();if(open){$("lineup").classList.add("open");$("lineup").querySelector(".xp").textContent="Fewer columns ‹"}wire()});
  document.querySelectorAll("#lvl button").forEach(b=>b.onclick=()=>{LVL=b.dataset.l;const open=$("minors").classList.contains("open");$("minors").outerHTML=minorsCard();if(open)$("minors").classList.add("open");wire()});
  document.querySelectorAll(".tw").forEach(t=>t.onscroll=edges);edges();
}
function edges(){document.querySelectorAll(".tw").forEach(t=>t.parentNode.classList.toggle("more",t.scrollWidth-t.clientWidth-t.scrollLeft>2))}
addEventListener("resize",edges);
$("footasof").innerHTML=`Depth chart: <b>FanGraphs RosterResource</b>, updated ${D.asof.rr} · Stats: <b>FanGraphs</b> ${D.season} regular season, as of ${D.asof.bat}`;
/* tooltips */
const tip=$("tip");
document.addEventListener("mouseover",e=>{const el=e.target.closest("[data-tip]");if(!el){tip.hidden=true;return}tip.innerHTML=el.dataset.tip;tip.hidden=false});
document.addEventListener("mousemove",e=>{if(tip.hidden)return;const w=tip.offsetWidth;tip.style.left=Math.min(innerWidth-w-8,e.clientX+14)+"px";tip.style.top=(e.clientY+16)+"px"});
render();
</script>
</body></html>
