<style>.tclogo{display:inline-flex;align-items:center;flex:none;transition:transform .18s ease,filter .18s ease}.tclogo:hover{transform:translateY(-2px);filter:drop-shadow(0 4px 6px rgba(12,35,64,.25))}.tclogo svg{height:84px;width:auto;display:block}.tclogo .lg-icon{display:none}@media (max-width:820px){.tclogo .lg-full{display:none}.tclogo .lg-icon{display:block}.tclogo svg{height:42px}}

:root{--navy:#0c2340;--navy2:#1d3a63;--ink:#0f1c2e;--mut:#5d6b7e;--faint:#95a1b1;--hair:rgba(12,35,64,.10);
  --good:#16a34a;--goodk:#0d7a37;--bad:#b0583f;--badk:#9c4631;--neu:#9aa0b2;--style:#6f7d93;
  --card:linear-gradient(180deg,#ffffff 0%,#f7f9fc 100%);
  --sh:0 1px 0 #fff inset,0 18px 40px -22px rgba(12,35,64,.35),0 3px 10px -4px rgba(12,35,64,.12);}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Manrope,system-ui,sans-serif;color:var(--ink);background:#eef2f7;overflow:hidden;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
/* atmosphere: cool white, Yankee Stadium at night faintly, navy haze around the sun */
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(900px 620px at 34% 52%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),
             radial-gradient(1200px 700px at 30% 50%,rgba(29,58,99,.10),transparent 70%),
             linear-gradient(180deg,#f7f9fc 0%,#e9eef5 100%)}
#bg .photo{position:absolute;inset:0;background:url("https://upload.wikimedia.org/wikipedia/commons/thumb/9/92/A_Great_Night_at_Yankee_Stadium.jpg/1920px-A_Great_Night_at_Yankee_Stadium.jpg") center 60%/cover;
  opacity:.10;filter:grayscale(.6) blur(2px);mix-blend-mode:multiply;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 55%,#000 100%);mask-image:linear-gradient(180deg,transparent 0%,#000 55%,#000 100%)}
#bg .mark{position:absolute;right:470px;top:90px;width:300px;opacity:.035}
#app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:1fr 430px;grid-template-rows:auto 1fr;gap:0 18px;padding:14px 20px 14px 22px}
/* ceremony */
header{grid-column:1/3;display:flex;align-items:center;gap:16px;padding-bottom:8px}
header .logo{width:46px;height:46px;border-radius:14px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center}
header .logo img{width:32px}
header .nm{font-family:Fraunces,serif;font-weight:700;font-size:34px;letter-spacing:-.01em;color:var(--navy);line-height:1}
header .nm i{font-style:normal;font-family:Fraunces,serif;color:var(--navy2);opacity:.35;margin-left:.2em}
header .meta{font-size:12.5px;color:var(--mut);margin-top:4px}
header .meta b{color:var(--ink)}
.chips{margin-left:auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:760px}
.chips .k{font-size:10.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-right:4px}
.yr{font:700 12px Manrope;color:var(--mut);border:0;border-radius:99px;padding:6px 10px;cursor:pointer;background:linear-gradient(180deg,#fff,#eef2f7);
  box-shadow:0 1px 0 #fff inset,0 0 0 1px var(--hair),0 2px 4px -2px rgba(12,35,64,.2);transition:transform .12s,box-shadow .12s}
.yr:hover{transform:translateY(-1px)}

.showing{width:100%;text-align:right;font-size:11.5px;color:var(--mut);margin-top:3px}

/* the orbit stage */
#stage{position:relative;grid-column:1;min-height:0}

.sun{position:absolute;border-radius:50%;transform:translate(-50%,-50%);

/* planets: glossy pressable spheres */
.pl{position:absolute;transform:translate(-50%,-50%);border:0;border-radius:50%;padding:0;cursor:pointer;font-family:Manrope;color:var(--ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 36% 24%,#fff 0%,#fff 14%,#f3f6fa 36%,#dfe6ef 74%,#ccd5e1 100%);
  box-shadow:inset 0 -8px 16px rgba(12,35,64,.10),inset 0 2px 2px #fff,0 14px 24px -12px rgba(12,35,64,.45),0 2px 6px rgba(12,35,64,.10);
  transition:transform .16s cubic-bezier(.3,1.4,.5,1),box-shadow .16s}
.pl::before{content:"";position:absolute;left:19%;top:9%;width:40%;height:22%;border-radius:50%;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0));filter:blur(.5px);pointer-events:none}

.pl .lab{font-weight:800;letter-spacing:.04em;color:var(--mut);position:relative}

  box-shadow:inset 0 -8px 16px rgba(10,90,40,.12),inset 0 2px 2px #fff,0 14px 24px -12px rgba(12,35,64,.45),
   0 0 0 calc(1px + var(--i)*2.5px) rgba(34,197,94,calc(.22 + var(--i)*.5)),0 0 calc(10px + var(--i)*36px) calc(var(--i)*8px) rgba(34,197,94,calc(.14 + var(--i)*.40))}
.pl.g b{color:color-mix(in oklab,var(--goodk) calc(55% + var(--i)*45%),var(--navy))}
.pl.b{background:radial-gradient(circle at 36% 24%,#fff 0%,#fdf9f7 12%,color-mix(in oklab,var(--bad) calc(var(--i)*7% + 7%),#f7f1ee) 40%,color-mix(in oklab,var(--bad) calc(var(--i)*12% + 14%),#ebe4e1) 100%);
  box-shadow:inset 0 -8px 16px rgba(120,50,30,.08),inset 0 2px 2px #fff,0 14px 24px -12px rgba(12,35,64,.4),0 0 0 1.5px rgba(176,88,63,calc(.32 + var(--i)*.2))}

/* clusters on the outer ring */

  background:linear-gradient(180deg,rgba(255,255,255,.97),rgba(247,249,252,.94));border:1px solid rgba(255,255,255,.95);outline:1px solid var(--hair);outline-offset:-1px;
  box-shadow:0 1px 0 #fff inset,0 1px 2px rgba(12,35,64,.06),0 10px 30px -12px rgba(12,35,64,.28),0 30px 60px -40px rgba(12,35,64,.25);transition:box-shadow .16s,outline-color .16s;overflow:hidden}

.bt{position:relative;display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:54px;border:1px solid rgba(12,35,64,.09);border-radius:15px;padding:6px 8px;

.mixl{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:7px;position:relative}
.mixl span{font-size:11.5px;color:var(--mut);display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.mixl span i{width:8px;height:8px;border-radius:3px;flex:none;align-self:center}
.mixl span b{color:var(--ink);font-size:12.5px}
.mixl span small{color:var(--faint);font-size:10.5px;margin-left:auto}.mixl span small.g{color:var(--goodk);font-weight:800}.mixl span small.b{color:var(--badk);font-weight:700}
/* pitch mix as a ranked list: each name beside its own bar, share at the bar's end (no legend, no leader lines) */
.pml{display:flex;flex-direction:column;gap:4px;margin-top:4px}
.pmr{display:grid;grid-template-columns:78px minmax(0,1fr) 32px 38px;align-items:center;gap:8px;font-size:12px;line-height:1.1}
.pmn{font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
.pmt{display:flex;align-items:center;gap:6px;min-width:0}
.pmt i{display:block;flex:none;height:13px;min-width:5px;border-radius:99px;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,0) 55%),linear-gradient(90deg,var(--navy),var(--navy));box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 4px 9px -5px rgba(12,35,64,.6)}
.pmt b{font-size:13.5px;font-weight:800;color:var(--ink);white-space:nowrap}
.pmv{font-size:10.5px;font-weight:700;color:var(--mut);text-align:right;white-space:nowrap}
.pms{font-size:10.5px;font-weight:700;color:var(--faint);text-align:right;white-space:nowrap}.pms.g{color:var(--goodk);font-weight:800}.pms.b{color:var(--badk);font-weight:700}
.pmr.oth .pmn{color:var(--mut);font-weight:700}.pmr.oth .pmt i{background:linear-gradient(90deg,#c9d0db,#b3bdcc);box-shadow:none}
.pml .pmh{font-size:9.5px;font-weight:800;letter-spacing:.08em;color:var(--faint)}
.pml.big{max-width:720px;gap:8px;margin:2px 0 4px}.pml.big .pmr{grid-template-columns:110px minmax(0,1fr) 70px 84px;font-size:13.5px}.pml.big .pmt i{height:17px}.pml.big .pmt b{font-size:16px}.pml.big .pmv,.pml.big .pms{font-size:12px}
/* career chart inside the sheet */
#sheet #rail{height:215px;margin:0 0 12px;max-width:1240px;flex:none}
#sheet #rail .top{flex-wrap:wrap;row-gap:6px}
.pick{display:flex;flex-wrap:wrap;gap:5px;margin-left:8px}
.pick .yr{padding:6px 11px}
#rplot .pc{position:absolute;transform:translate(-50%,-100%);font-size:9.5px;font-weight:800;color:var(--faint);white-space:nowrap;pointer-events:none}
#rplot .pc.g{color:var(--goodk)}#rplot .pc.b{color:var(--badk)}
.swipe{display:none;font-size:11.5px;font-weight:800;color:var(--navy2);margin:0 0 6px}
body.flat .swipe{display:block}
body.flat .twrap:after{opacity:1;width:40px}body.flat .twrap:not(.more):after{opacity:0}
body.flat header{padding-bottom:4px}body.flat .pswitch{margin-left:0}
body.flat .layer{position:relative;left:auto;top:auto;flex-basis:100%;text-align:center;margin-bottom:4px}
body.flat .cl .t{flex-wrap:wrap;row-gap:3px}body.flat .cl .t i{margin-left:auto}
body.flat #sheet #rail{height:220px}
body.flat .hs6 b{font-size:28px}
body.flat .pl2 td:nth-child(2),body.flat .pl2 th:nth-child(2){display:none}body.flat .pl2{font-size:11.5px}body.flat .pl2 td,body.flat .pl2 th{padding:4px 3px}
/* round 3: direct labels, pitcher views */
.mb{position:relative;margin-top:2px}
.mb .mixc div{position:relative}
.mb .mixc span{font-size:10.5px;font-weight:700;line-height:1.15;text-align:center;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.mb .mixc span b{font-weight:800}.mb .mixc small{font-size:9.5px;opacity:.85;font-weight:700}.mb .mixc small.g{color:#b9f5cf;opacity:1}.mb .mixc small.b{color:#f3c4b5;opacity:1}
.mb.big .mixc span{font-size:12px}.mb.big .mixc small{font-size:10.5px}
.mb .ld{position:absolute;width:1px;background:rgba(12,35,64,.35);transform:translateX(-.5px)}
.mb .ol{position:absolute;transform:translateX(-50%);font-size:10.5px;font-weight:700;color:var(--mut);white-space:nowrap}
.mb .ol small{color:var(--faint);font-weight:700}.mb .ol small.g{color:var(--goodk)}.mb .ol small.b{color:var(--badk)}
.pswitch{display:flex;align-items:center;gap:2px;margin:6px 0 0;padding:3px;width:max-content;max-width:100%;flex-wrap:wrap}
.pswitch .pg{font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 4px 0 8px}
.pswitch .pg:first-child{margin-left:4px}
.pswitch a{padding:6px 11px}
#credit{position:fixed;left:22px;bottom:5px;z-index:2;font-size:9.5px;color:var(--faint);pointer-events:none}
body.flat #credit{position:static;padding:8px 12px 14px}
#sheet h5.sx{margin:16px 0 6px;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
.smc{border-radius:16px;padding:8px 10px 4px;background:linear-gradient(180deg,#fff,#f5f7fb);box-shadow:0 0 0 1px var(--hair),0 6px 14px -10px rgba(12,35,64,.35)}
.smt{font-size:12px;font-weight:800;color:var(--navy)}
.smc text{font:700 9px Manrope}.smc .bl{fill:#5d6b7e}.smc .yl{fill:#95a1b1}.smc .zl{fill:#95a1b1;font-size:8.5px}.smc .rl{fill:#0d7a37;font-size:9.5px}
#rplot .el{position:absolute;transform:translateY(-50%);font-size:10.5px;font-weight:800;color:var(--navy);white-space:nowrap}
#rplot .el.lgl{color:#8a95a8;font-weight:700}
#sheet #rplot{margin-right:96px}
body.flat #sheet .mb{overflow:visible}
body.flat .pswitch{width:auto;row-gap:4px}body.flat .pswitch .pg{flex-basis:100%;margin:4px 0 0 6px}body.flat header>div{min-width:0}
/* expanded views: what opens depends on what was clicked */
.ct th.gs,.ct td.gs{border-left:1px solid rgba(12,35,64,.12)}
.ct th.hk{color:#fff;background:linear-gradient(180deg,var(--navy2),var(--navy))}
.ct td.hk{box-shadow:inset 2px 0 0 var(--navy2),inset -2px 0 0 var(--navy2)}
.ct td.hk.n,.ct td.hk.st{background:rgba(12,35,64,.05)}
.ct td small.li{display:block;font-size:10px;font-weight:600;color:var(--faint);line-height:1.15;margin-top:1px}
.ct td small{font-weight:600;color:var(--faint)}
.pcg{display:grid;grid-template-columns:repeat(auto-fill,minmax(560px,1fr));gap:12px;max-width:1240px;flex:none}
.pcg.nar{grid-template-columns:repeat(auto-fill,minmax(360px,1fr))}
.pcard{padding:10px 12px 12px;min-width:0}
.pcard .smt{font-size:14px}.pcard .smt small{font-size:11px;font-weight:700;color:var(--faint);margin-left:8px}
.pcard .twrap{margin-top:4px}.pcard .ct{font-size:12.5px}.pcard .ct td{padding:6px 9px}
.pl:hover,.pl:focus-visible{outline:2px solid color-mix(in oklab,var(--navy) 35%,transparent);outline-offset:3px}
.cl .bt{cursor:pointer;transition:transform .12s,border-color .12s}.cl .bt:hover{transform:translateY(-1px);border-color:color-mix(in oklab,var(--navy) 45%,transparent)}
body.flat .pcg,body.flat .pcg.nar{grid-template-columns:1fr}
#sheet #rail{height:196px}
body.flat #sheet .pick{flex-wrap:nowrap;overflow-x:auto;max-width:100%;margin-left:0;padding-bottom:2px;scrollbar-width:none}body.flat #sheet #rail .top{flex-wrap:nowrap;flex-direction:column;align-items:flex-start}body.flat #sheet #rail .top .key{display:none}
body.flat #sheet #rplot{margin:8px 56px 0 36px}
/* the player's name, repeated quietly: a huge faint watermark behind the tiles, in every expanded view's title, and a slim sticky bar on phones */
#bg .wm{position:absolute;left:-.04em;bottom:-.1em;font:700 clamp(150px,24vw,420px)/1 Fraunces,serif;letter-spacing:-.03em;white-space:nowrap;
  color:color-mix(in oklab,var(--navy) 3.5%,transparent);-webkit-text-stroke:1.5px color-mix(in oklab,var(--navy) 13%,transparent)}
body.flat #bg .wm{font-size:42vw;bottom:-.12em}
#sheet h3 .who{color:var(--navy)}#sheet h3 .who i{font:800 10.5px Manrope;font-style:normal;letter-spacing:.06em;color:var(--mut);margin:0 2px 0 7px;vertical-align:.35em}
#sheet h3 .sep{color:var(--faint);margin:0 .28em;font-weight:500}
#nbar{position:fixed;left:0;right:0;top:0;z-index:30;display:none;align-items:center;gap:9px;padding:7px 14px;background:rgba(255,255,255,.86);backdrop-filter:blur(12px);
  box-shadow:0 1px 0 #fff inset,0 8px 20px -14px rgba(12,35,64,.5),0 1px 0 var(--hair);transform:translateY(-110%);transition:transform .2s}
#nbar img{width:22px;height:22px}#nbar b{font:700 17px Fraunces,serif;color:var(--navy)}#nbar span{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.flat #nbar{display:flex}body.flat #nbar.on{transform:none}

#bg .chopwm{position:absolute;left:-190px;top:30px;width:600px;height:600px;background:var(--chopmark) center/contain no-repeat;
  transform:rotate(-6deg);opacity:.10;filter:grayscale(.55) contrast(.9);mix-blend-mode:multiply}
body.flat #bg .chopwm{width:420px;height:420px;left:-150px;top:10px;opacity:.07}
header{position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:8px;background:var(--stitch) 0 0/11px 8px repeat-x;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
#app{row-gap:8px;grid-template-rows:auto 1fr auto}
#seamv{grid-column:2;grid-row:2;justify-self:start;margin-left:-13px;width:8px;z-index:3;pointer-events:none;background:var(--stitchv) 0 0/8px 11px repeat-y;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(180deg,transparent,#000 8%,#000 92%,transparent)}
#panel h5,#panel .src{padding-top:12px;background:var(--stitch) 0 0/11px 8px repeat-x}
body.flat #seamv{display:none}
#panel{grid-row:2/4!important}
#foot{grid-column:1;grid-row:3;display:flex;align-items:center;gap:16px;padding:4px 6px 0;border-top:1px solid var(--hair)}
#foot .fl{height:80px;width:auto;flex:none;display:block;filter:drop-shadow(0 3px 5px rgba(12,35,64,.18))}
#foot .ft{font-size:11px;line-height:1.5;color:var(--mut);padding:6px 12px;border-radius:12px;background:rgba(255,255,255,.74);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);box-shadow:0 0 0 1px rgba(255,255,255,.6)}#foot .ft b{color:var(--ink)}#foot .ft small{display:block;color:var(--mut);font-size:10.5px}
#credit{display:none}
body.flat #foot{flex-direction:column;align-items:flex-start;gap:8px;padding:14px 6px 18px;margin-top:12px}body.flat #foot .fl{height:72px}
/* the seal is a small float at the right of the footnote, so the footnote wraps beside it: it always fits inside the panel and never overlaps text */
#panel .src .seal{float:right;position:relative;width:64px;height:64px;margin:-2px 0 2px 12px;pointer-events:none}
#panel .src .seal::before,#panel .src .seal::after{content:"";position:absolute;inset:0;
  -webkit-mask:var(--chopmark) center/contain no-repeat;mask:var(--chopmark) center/contain no-repeat}
#panel .src .seal::before{background:rgba(12,35,64,.22);translate:1.5px 1.5px;filter:blur(.5px)}
#panel .src .seal::after{background:linear-gradient(135deg,#f3f5f9,#e6ebf2);translate:-.5px -.5px}
/* D27: the background is washed in his team colours; depth (saturation, glow, sheen, pinstripes, the halo behind his photo) follows --q, his headline percentile */
@property --q{syntax:'<number>';inherits:true;initial-value:0}
:root{--q:0;--tc1:#0c2340;--tc2:#1d3a63;transition:--q .7s ease;
  /* luminous versions of his team colours: same hue, lifted lightness and saturation, so richness reads as colour, never as grey */
  --l1:oklch(from var(--tc1) .70 calc(c*1.3 + .07) h);--l2:oklch(from var(--tc2) .72 calc(c*1.3 + .07) h)}
#bg{background:
  radial-gradient(880px 600px at 34% 52%,rgba(255,255,255,.94),rgba(255,255,255,0) 70%),
  radial-gradient(1150px 800px at 100% 0%,color-mix(in oklab,var(--l2) calc(10% + var(--q)*38%),transparent),transparent 66%),
  radial-gradient(1050px 760px at 0% 100%,color-mix(in oklab,var(--l1) calc(8% + var(--q)*32%),transparent),transparent 64%),
  radial-gradient(760px 520px at 72% 92%,color-mix(in oklab,var(--l2) calc(var(--q)*24%),transparent),transparent 70%),
  linear-gradient(180deg,color-mix(in oklab,var(--tc1) 3%,#f7f9fc) 0%,color-mix(in oklab,var(--tc1) 6%,#eef2f7) 100%)}
#bg::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(118deg,transparent 22%,rgba(255,255,255,calc(var(--q)*.55)) 38%,rgba(255,255,255,0) 52%,transparent 70%,rgba(255,255,255,calc(var(--q)*.30)) 82%,transparent 92%)}
#bg::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 26px,color-mix(in oklab,var(--l1) calc(var(--q)*16%),transparent) 26px 27px);
  -webkit-mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.25) 70%,transparent);mask-image:linear-gradient(180deg,#000,rgba(0,0,0,.25) 70%,transparent)}
.sun{box-shadow:0 0 0 5px #fff,0 0 0 7px rgba(12,35,64,.85),0 0 0 9px rgba(255,255,255,.9),0 0 60px 26px rgba(120,160,220,.30),0 0 140px 60px rgba(255,255,255,.75),0 24px 50px -10px rgba(12,35,64,.45),
  0 0 calc(160px + var(--q)*160px) calc(40px + var(--q)*70px) color-mix(in oklab,var(--l2) calc(var(--q)*42%),transparent)}
</style></head>
